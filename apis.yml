name: Town
description: >-
  Town is a personal AI assistant that works across email, calendar, Slack,
  docs, WhatsApp, and the web. Users connect their accounts and Town — through
  a personal agent called a "Townie" — learns how they work, then suggests and
  runs automated "routines" (meeting briefs, email drafting, follow-ups,
  scheduling) on their behalf. Founded by Jean-Denis Greze (former Plaid CTO)
  and Tony Vincent (former Google product/AI lead), Town raised a $55M Series A
  led by Andreessen Horowitz (June 2026) with Forerunner Ventures, First Round,
  Alt Capital, and Conviction participating. Town publishes no public developer
  program: the product is fully auth-gated, api.town.com is a Convex backend
  deployment rather than a public API, and its robots.txt carries explicit
  Content-Signal declarations restricting AI training on its content.
